name: CI, Container Delivery, and Kubernetes Deployment

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality:
    name: Test and security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflow
        run: docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run validation and automated tests
        run: npm run test:ci

      - name: Block high-severity dependency vulnerabilities
        run: npm run audit:ci

      - name: Scan source, secrets, and deployment configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: node_modules

      - name: Validate Docker Compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.db.yml config -q

  deployment-validation:
    name: Validate Kubernetes and Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Install Ansible and Kubernetes dependencies
        run: |
          python -m pip install --requirement ansible/requirements.txt
          ansible-galaxy collection install --requirements-file ansible/requirements.yml

      - name: Build Kubernetes overlays
        run: |
          kubectl kustomize k8s/overlays/staging > "$RUNNER_TEMP/butler-staging.yaml"
          kubectl kustomize k8s/overlays/production > "$RUNNER_TEMP/butler-production.yaml"
          test -s "$RUNNER_TEMP/butler-staging.yaml"
          test -s "$RUNNER_TEMP/butler-production.yaml"

      - name: Run Ansible syntax checks
        run: |
          ansible-playbook --syntax-check --inventory ansible/inventory.example.yml ansible/playbooks/bootstrap-k3s.yml
          ansible-playbook --syntax-check --inventory ansible/inventory.example.yml ansible/playbooks/export-kubeconfig.yml
          ansible-playbook --syntax-check --inventory localhost, ansible/playbooks/install-cert-manager.yml
          ansible-playbook --syntax-check --inventory localhost, ansible/playbooks/deploy.yml
          ansible-playbook --syntax-check --inventory localhost, ansible/playbooks/rollback.yml

  docker-smoke:
    name: Build and smoke-test containers
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and start isolated demo stack
        env:
          CHAT_MOCK_MODE: "true"
          LOCAL_DEMO_MODE: "true"
        run: docker compose up -d --build --wait

      - name: Run HTTP, authentication, page, and task CRUD smoke tests
        env:
          BASE_URL: http://127.0.0.1:3001
        run: npm run smoke

      - name: Verify the application container is non-root
        run: test "$(docker compose exec -T butler-app id -u)" = "1000"

      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs-${{ github.run_id }}
          path: docker-compose.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop isolated demo stack
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    name: Publish verified image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, deployment-validation, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Define immutable image reference
        id: image
        shell: bash
        run: |
          echo "repository=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "ref=${IMAGE_NAME,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build local candidate image for security scan
        run: docker build --pull --tag "${{ steps.image.outputs.ref }}" .

      - name: Block high-severity candidate image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and publish verified image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy-staging:
    name: Deploy staging with Ansible
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: [self-hosted, Linux, X64, butler-k3s]
    timeout-minutes: 20
    concurrency:
      group: butler-staging-deployment
      cancel-in-progress: true
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Install Ansible and Kubernetes dependencies
        run: |
          python -m pip install --requirement ansible/requirements.txt
          ansible-galaxy collection install --requirements-file ansible/requirements.yml

      - name: Verify staging GHCR read credential
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: bash scripts/verify-ghcr-read.sh

      - name: Deploy and verify staging
        env:
          DEPLOY_ENV: staging
          K8S_AUTH_KUBECONFIG: /home/github-runner/.kube/config
          IMAGE: ${{ needs.publish.outputs.image }}
          APP_HOST: ${{ vars.APP_HOST }}
          APP_URL: ${{ vars.APP_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGODB_EXPORTER_URI: ${{ secrets.MONGODB_EXPORTER_URI }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          N8N_OTP_WEBHOOK_URL: ${{ secrets.N8N_OTP_WEBHOOK_URL }}
          PROMETHEUS_REMOTE_WRITE_URL: ${{ vars.PROMETHEUS_REMOTE_WRITE_URL }}
          PROMETHEUS_USERNAME: ${{ secrets.PROMETHEUS_USERNAME }}
          PROMETHEUS_API_KEY: ${{ secrets.PROMETHEUS_API_KEY }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: ansible-playbook ansible/playbooks/deploy.yml

  deploy-production:
    name: Approve and deploy production with Ansible
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [publish, deploy-staging]
    runs-on: [self-hosted, Linux, X64, butler-k3s]
    timeout-minutes: 20
    concurrency:
      group: butler-production-deployment
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Install Ansible and Kubernetes dependencies
        run: |
          python -m pip install --requirement ansible/requirements.txt
          ansible-galaxy collection install --requirements-file ansible/requirements.yml

      - name: Verify production GHCR read credential
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: bash scripts/verify-ghcr-read.sh

      - name: Deploy and verify production
        env:
          DEPLOY_ENV: production
          K8S_AUTH_KUBECONFIG: /home/github-runner/.kube/config
          IMAGE: ${{ needs.publish.outputs.image }}
          APP_HOST: ${{ vars.APP_HOST }}
          APP_URL: ${{ vars.APP_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGODB_EXPORTER_URI: ${{ secrets.MONGODB_EXPORTER_URI }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          N8N_OTP_WEBHOOK_URL: ${{ secrets.N8N_OTP_WEBHOOK_URL }}
          PROMETHEUS_REMOTE_WRITE_URL: ${{ vars.PROMETHEUS_REMOTE_WRITE_URL }}
          PROMETHEUS_USERNAME: ${{ secrets.PROMETHEUS_USERNAME }}
          PROMETHEUS_API_KEY: ${{ secrets.PROMETHEUS_API_KEY }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: ansible-playbook ansible/playbooks/deploy.yml
