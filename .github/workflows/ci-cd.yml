name: CI and Container Delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Test and security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run validation and automated tests
        run: npm run test:ci

      - name: Block high-severity dependency vulnerabilities
        run: npm run audit:ci

      - name: Validate Docker Compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.db.yml config -q

  docker-smoke:
    name: Build and smoke-test containers
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and start isolated demo stack
        env:
          CHAT_MOCK_MODE: "true"
          LOCAL_DEMO_MODE: "true"
        run: docker compose up -d --build --wait

      - name: Run HTTP, authentication, page, and task CRUD smoke tests
        env:
          BASE_URL: http://127.0.0.1:3001
        run: npm run smoke

      - name: Verify the application container is non-root
        run: test "$(docker compose exec -T butler-app id -u)" = "1000"

      - name: Capture Docker logs
        if: always()
        run: docker compose logs --no-color > docker-compose.log

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-logs-${{ github.run_id }}
          path: docker-compose.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop isolated demo stack
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    name: Publish verified image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish verified image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
