name: Verify GHCR Environment Credential

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment whose GHCR credential will be tested
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.target_environment }} GHCR read credential
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: ${{ inputs.target_environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read the immutable image manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_VERIFY_REPOSITORY_ONLY: "true"
        run: bash scripts/verify-ghcr-read.sh
