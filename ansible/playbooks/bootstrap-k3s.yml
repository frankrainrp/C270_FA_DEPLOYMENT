# Owner: Sherlyn - Ansible Automation
---
- name: Prepare Linux nodes for K3s
  hosts: k3s_cluster
  become: true
  gather_facts: true
  tasks:
    - name: Require a supported Debian or Ubuntu host
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
          - ansible_service_mgr == "systemd"
          - ansible_architecture in ["x86_64", "aarch64"]
        fail_msg: This playbook supports systemd-based Debian or Ubuntu x86_64/aarch64 hosts.

    - name: Require the K3s cluster token
      ansible.builtin.assert:
        that:
          - k3s_token | length >= 32
        fail_msg: Export a random K3S_TOKEN of at least 32 characters before provisioning.
      no_log: true

    - name: Install operating-system prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create K3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Download the official K3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/src/install-k3s.sh
        owner: root
        group: root
        mode: "0755"

- name: Install the first K3s server
  hosts: k3s_server
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Require one demo server or three HA servers
      ansible.builtin.assert:
        that:
          - groups['k3s_server'] | length in [1, 3]
        fail_msg: Configure one server for a small deployment or three servers for embedded-etcd high availability.
      run_once: true

    - name: Write the first server's persistent K3s configuration
      ansible.builtin.template:
        src: ../templates/k3s-server-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
      notify: Restart K3s server
      when: inventory_hostname == groups['k3s_server'][0]

    - name: Read the first server's installed K3s version
      ansible.builtin.command:
        argv: [k3s, --version]
      register: installed_k3s
      changed_when: false
      failed_when: false
      when: inventory_hostname == groups['k3s_server'][0]

    - name: Install or upgrade the pinned first K3s server
      ansible.builtin.command:
        argv: [/usr/local/src/install-k3s.sh]
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server
        K3S_TOKEN: "{{ k3s_token }}"
      when:
        - inventory_hostname == groups['k3s_server'][0]
        - k3s_version not in (installed_k3s.stdout | default(''))
      no_log: true
      notify: Restart K3s server

    - name: Enable and start the first K3s server
      ansible.builtin.systemd_service:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true
      when: inventory_hostname == groups['k3s_server'][0]

    - name: Wait for the first Kubernetes API
      ansible.builtin.command:
        argv: [k3s, kubectl, get, --raw=/readyz]
      register: api_ready
      changed_when: false
      retries: 30
      delay: 5
      until: api_ready.rc == 0
      when: inventory_hostname == groups['k3s_server'][0]

  handlers:
    - name: Restart K3s server
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        daemon_reload: true

- name: Join additional K3s servers for embedded-etcd high availability
  hosts: k3s_server
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: Write persistent joining-server configuration
      ansible.builtin.template:
        src: ../templates/k3s-server-config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
      when: inventory_hostname != groups['k3s_server'][0]
      notify: Restart joining K3s server

    - name: Read the joining server's installed K3s version
      ansible.builtin.command:
        argv: [k3s, --version]
      register: joined_server_version
      changed_when: false
      failed_when: false
      when: inventory_hostname != groups['k3s_server'][0]

    - name: Install or upgrade the joining K3s server
      ansible.builtin.command:
        argv: [/usr/local/src/install-k3s.sh]
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server
        K3S_TOKEN: "{{ k3s_token }}"
      when:
        - inventory_hostname != groups['k3s_server'][0]
        - k3s_version not in (joined_server_version.stdout | default(''))
      no_log: true

    - name: Enable and start the joining K3s server
      ansible.builtin.systemd_service:
        name: k3s
        state: started
        enabled: true
        daemon_reload: true
      when: inventory_hostname != groups['k3s_server'][0]

    - name: Wait for the joining server to become Ready
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=5m
      delegate_to: "{{ groups['k3s_server'][0] }}"
      register: joining_server_ready
      changed_when: false
      when: inventory_hostname != groups['k3s_server'][0]

  handlers:
    - name: Restart joining K3s server
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        daemon_reload: true

- name: Install K3s agent nodes
  hosts: k3s_agents
  become: true
  gather_facts: false
  tasks:
    - name: Read the installed K3s agent version
      ansible.builtin.command:
        argv: [k3s, --version]
      register: installed_k3s_agent
      changed_when: false
      failed_when: false

    - name: Install or upgrade the pinned K3s agent
      ansible.builtin.command:
        argv: [/usr/local/src/install-k3s.sh]
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: agent
        K3S_URL: "https://{{ k3s_api_address }}:6443"
        K3S_TOKEN: "{{ k3s_token }}"
      when: k3s_version not in (installed_k3s_agent.stdout | default(''))
      no_log: true

    - name: Enable and start the K3s agent
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: started
        enabled: true
        daemon_reload: true

- name: Verify all K3s nodes
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: Wait for every inventory node to become Ready
      ansible.builtin.command:
        argv: [k3s, kubectl, wait, --for=condition=Ready, nodes, --all, --timeout=5m]
      register: node_readiness
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.command:
        argv: [k3s, kubectl, get, nodes, -o, wide]
      register: cluster_nodes
      changed_when: false

    - name: Print cluster node status
      ansible.builtin.debug:
        var: cluster_nodes.stdout_lines
