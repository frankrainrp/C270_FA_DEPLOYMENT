---
- name: Export the K3s kubeconfig to the Ansible control machine
  hosts: k3s_server
  become: true
  gather_facts: false
  run_once: true
  tasks:
    - name: Read the protected server kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: server_kubeconfig
      no_log: true

    - name: Create the local kubeconfig directory
      ansible.builtin.file:
        path: "{{ k3s_kubeconfig_output | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Write a remote-access kubeconfig locally
      ansible.builtin.copy:
        content: "{{ (server_kubeconfig.content | b64decode) | replace('127.0.0.1', k3s_api_address) }}"
        dest: "{{ k3s_kubeconfig_output }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Show the kubeconfig path
      ansible.builtin.debug:
        msg: "Kubeconfig written to {{ k3s_kubeconfig_output }}"
