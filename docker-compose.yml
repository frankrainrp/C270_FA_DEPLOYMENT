services:
  butler-app:
    build: .
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:-butler}:${MONGO_ROOT_PASSWORD:-butler-local-password}@mongo:27017/${MONGO_DATABASE:-butler}?authSource=admin
      MONGO_CONNECT_TIMEOUT_MS: ${MONGO_CONNECT_TIMEOUT_MS:-5000}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      CHAT_MOCK_MODE: ${CHAT_MOCK_MODE:-false}
      DOCUMENT_MAX_MB: ${DOCUMENT_MAX_MB:-10}
      DOCUMENT_TEXT_LIMIT: ${DOCUMENT_TEXT_LIMIT:-60000}
      N8N_OTP_WEBHOOK_URL: ${N8N_OTP_WEBHOOK_URL:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-butler_session}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      LOCAL_DEMO_MODE: ${LOCAL_DEMO_MODE:-true}
      LOCAL_DEMO_EMAIL: ${LOCAL_DEMO_EMAIL:-demo@butler.local}
      LOCAL_DEMO_NAME: ${LOCAL_DEMO_NAME:-Demo Student}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 10s

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-butler}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-butler-local-password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-butler}
    volumes:
      - butler_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 20s

volumes:
  butler_data:
