apiVersion: v1
kind: Service
metadata:
  name: butler-prometheus
  labels:
    app.kubernetes.io/name: butler
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    prometheus: butler
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      protocol: TCP
