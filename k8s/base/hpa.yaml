apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: butler
  labels:
    app.kubernetes.io/name: butler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: butler
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
