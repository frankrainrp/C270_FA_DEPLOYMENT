apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: butler
  labels:
    app.kubernetes.io/name: butler
    app.kubernetes.io/component: web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - butler.invalid
      secretName: butler-tls
  rules:
    - host: butler.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: butler
                port:
                  number: 80
