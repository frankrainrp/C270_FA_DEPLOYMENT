apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: butler
  labels:
    app.kubernetes.io/name: butler
    app.kubernetes.io/component: web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: butler
      app.kubernetes.io/component: web
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
    - port: mongodb-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
